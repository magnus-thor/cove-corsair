<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boatHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <!-- Mast -->
  <rect x="29" y="8" width="4" height="38" fill="#78350F" rx="1"/>
  <!-- Front Sail -->
  <path d="M33 12 L50 36 L33 36 Z" fill="url(#sailGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Back Sail -->
  <path d="M29 16 L14 36 L29 36 Z" fill="url(#sailGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Hull -->
  <path d="M8 40 L56 40 L48 54 L16 54 Z" fill="url(#boatHull)" stroke="#0369A1" stroke-width="2"/>
  <!-- Stripe on hull -->
