<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 90" width="310" height="90">
  <defs>
    <linearGradient id="woodBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5A34"/>
      <stop offset="50%" stop-color="#613B1E"/>
      <stop offset="100%" stop-color="#3D2210"/>
    </linearGradient>
    <linearGradient id="woodPlankOak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#472C19"/>
      <stop offset="35%" stop-color="#3A2213"/>
      <stop offset="70%" stop-color="#301A0D"/>
      <stop offset="100%" stop-color="#241308"/>
    </linearGradient>
    <filter id="woodBtnShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#woodBtnShadow)">
    <!-- Outer Carved Bevel Rim -->
    <rect x="6" y="6" width="298" height="78" rx="14" ry="14" fill="url(#woodBorderGrad)" stroke="#261408" stroke-width="2.5"/>
    <!-- Inner Dark Wood Plank -->
    <rect x="11" y="11" width="288" height="68" rx="10" ry="10" fill="url(#woodPlankOak)"/>
    <!-- Inner Top Edge Highlight -->
    <line x1="22" y1="13" x2="288" y2="13" stroke="#805634" stroke-width="1.5" opacity="0.6"/>
    <!-- Horizontal Plank Seam -->
    <line x1="12" y1="45" x2="298" y2="45" stroke="#1C0E06" stroke-width="2" opacity="0.8"/>
    <line x1="12" y1="47" x2="298" y2="47" stroke="#664024" stroke-width="1" opacity="0.3"/>
    <!-- Corner Decorative Rivets -->
    <circle cx="20" cy="20" r="2.5" fill="#C49A58" stroke="#261408" stroke-width="1"/>
    <circle cx="290" cy="20" r="2.5" fill="#C49A58" stroke="#261408" stroke-width="1"/>
    <circle cx="20" cy="70" r="2.5" fill="#C49A58" stroke="#261408" stroke-width="1"/>
    <circle cx="290" cy="70" r="2.5" fill="#C49A58" stroke="#261408" stroke-width="1"/>
  </g>
</svg>
