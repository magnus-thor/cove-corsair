<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A9AA5" />
      <stop offset="30%" stop-color="#E8EEF2" />
      <stop offset="70%" stop-color="#BDCBD4" />
      <stop offset="100%" stop-color="#697782" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#E5B22E" />
      <stop offset="100%" stop-color="#9C680A" />
    </linearGradient>
    <filter id="padlockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#padlockShadow)">
    <!-- Shackle -->
    <path d="M 16 22 L 16 14 C 16 9.5 19.5 6 24 6 C 28.5 6 32 9.5 32 14 L 32 22" fill="none" stroke="url(#shackleGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 16 22 L 16 14 C 16 9.5 19.5 6 24 6 C 28.5 6 32 9.5 32 14 L 32 22" fill="none" stroke="#2B1A0E" stroke-width="1.2"/>

    <!-- Lock Body -->
    <rect x="11" y="20" width="26" height="22" rx="5" fill="url(#bodyGrad)" stroke="#3E2610" stroke-width="2.5"/>
    <rect x="13.5" y="22" width="21" height="3" rx="1.5" fill="#FFF4B8" opacity="0.6"/>

    <!-- Keyhole -->
    <circle cx="24" cy="29" r="3" fill="#261507"/>
    <polygon points="22.5,29 25.5,29 26.5,36 21.5,36" fill="#261507"/>
  </g>
</svg>
