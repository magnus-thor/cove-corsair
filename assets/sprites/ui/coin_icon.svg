<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE770" />
      <stop offset="60%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#C68000" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0" />
      <stop offset="50%" stop-color="#D49000" />
      <stop offset="100%" stop-color="#7B4B00" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#goldRim)" filter="url(#dropShadow)"/>
  <circle cx="32" cy="32" r="25" fill="url(#goldGlow)" stroke="#FFF8B0" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#B87300" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Crossed Bones / Doubloon Emblem -->
  <g fill="#FFF280" opacity="0.95">
    <polygon points="32,16 35,26 45,26 37,32 40,42 32,36 24,42 27,32 19,26 29,26"/>
  </g>
</svg>
